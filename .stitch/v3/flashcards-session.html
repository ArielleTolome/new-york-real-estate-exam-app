<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Review — NY RE Exam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --font-helvetica: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Inter", sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .heading-helvetica {
      font-family: var(--font-helvetica);
      letter-spacing: -0.02em;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    /* Subway line styling */
    .station-track {
      background: rgba(148, 163, 184, 0.16);
    }
    .station-progress {
      background: #10b981;
    }
  </style>
</head>
<body class="bg-[#090d16] text-[#f1f5f9] min-h-screen flex flex-col items-center justify-start antialiased selection:bg-[#10b981]/20">
  <!-- Mobile Screen Container: 393px iPhone frame -->
  <main class="w-full max-w-[393px] min-h-screen flex flex-col justify-between px-4 pt-3 pb-8 relative">

    <!-- Top Navigation & Station Progress Header -->
    <header class="w-full pt-1 pb-4">
      <!-- Status bar gap / top bar -->
      <div class="h-11 flex items-center justify-between">
        <!-- Close (x) icon button (at least 44pt target) -->
        <button type="button" aria-label="Close session" class="w-11 h-11 flex items-center justify-center rounded-full bg-[#182033] hover:bg-[#1f2b45] active:scale-95 transition-all text-[#a3b1c6] hover:text-[#f1f5f9]">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>

        <!-- Card 8 of 24 in bold tabular numerals -->
        <div class="heading-helvetica font-bold text-[17px] tabular-nums text-[#f1f5f9]">
          Card 8 of 24
        </div>

        <!-- Listen speaker icon button (at least 44pt target) -->
        <button type="button" aria-label="Listen to audio" class="w-11 h-11 flex items-center justify-center rounded-full bg-[#182033] hover:bg-[#1f2b45] active:scale-95 transition-all text-[#a3b1c6] hover:text-[#f1f5f9]">
          <span class="material-symbols-outlined text-[20px]">volume_up</span>
        </button>
      </div>

      <!-- 4px progress line with station dots -->
      <div class="mt-3 relative w-full flex items-center">
        <!-- Background track -->
        <div class="w-full h-1 station-track rounded-full absolute top-1/2 -translate-y-1/2"></div>
        <!-- Active completed track (Card 8 of 24 = ~33.3%) -->
        <div class="h-1 station-progress rounded-full absolute top-1/2 -translate-y-1/2 left-0" style="width: 33.3%;"></div>

        <!-- Subway station stops (7 key milestones along route) -->
        <div class="relative w-full flex justify-between items-center z-10 px-0.5 pointer-events-none">
          <!-- Station 1 (passed) -->
          <span class="w-2.5 h-2.5 rounded-full bg-[#10b981] ring-2 ring-[#090d16]"></span>
          <!-- Station 2 (passed) -->
          <span class="w-2 h-2 rounded-full bg-[#10b981] ring-2 ring-[#090d16]"></span>
          <!-- Station 3 (current stop) -->
          <span class="w-3.5 h-3.5 rounded-full bg-[#10b981] ring-2 ring-[#090d16] flex items-center justify-center shadow-[0_0_8px_rgba(16,185,129,0.5)]">
            <span class="w-1.5 h-1.5 rounded-full bg-[#090d16]"></span>
          </span>
          <!-- Station 4 (upcoming) -->
          <span class="w-2 h-2 rounded-full bg-[#182033] ring-2 ring-[#090d16] border border-[#a3b1c6]/30"></span>
          <!-- Station 5 (upcoming) -->
          <span class="w-2 h-2 rounded-full bg-[#182033] ring-2 ring-[#090d16] border border-[#a3b1c6]/30"></span>
          <!-- Station 6 (upcoming) -->
          <span class="w-2 h-2 rounded-full bg-[#182033] ring-2 ring-[#090d16] border border-[#a3b1c6]/30"></span>
          <!-- Station 7 (terminal) -->
          <span class="w-2.5 h-2.5 rounded-full bg-[#182033] ring-2 ring-[#090d16] border border-[#a3b1c6]/40"></span>
        </div>
      </div>
    </header>

    <!-- Center Flashcard: Back Side after tap-to-flip -->
    <section class="flex-1 flex flex-col justify-center py-2">
      <article class="bg-[#111725] border border-[rgba(148,163,184,0.16)] rounded-[24px] p-6 flex flex-col shadow-2xl relative overflow-hidden transition-transform duration-200">
        
        <!-- Subtle back side indicator badge -->
        <div class="flex items-center justify-between mb-5">
          <!-- Route bullet (red "1") + chapter name -->
          <div class="flex items-center gap-2.5">
            <!-- Red #DA291C Route Bullet with bold "1" -->
            <div class="w-7 h-7 rounded-full bg-[#DA291C] flex items-center justify-center shrink-0 shadow-sm">
              <span class="heading-helvetica text-white font-bold text-[15px] leading-none tabular-nums">1</span>
            </div>
            <span class="text-[#a3b1c6] text-[14px] font-medium tracking-tight">License Law & Article 12-A</span>
          </div>

          <!-- Muted label: Key number -->
          <span class="text-[#a3b1c6] text-[12px] font-medium tracking-normal bg-[#182033] px-2.5 py-1 rounded-[14px] border border-[rgba(148,163,184,0.12)]">
            Key number
          </span>
        </div>

        <!-- Prompt in secondary ink -->
        <div class="text-[#a3b1c6] text-[17px] leading-snug font-normal mb-5">
          Maximum DOS fine in lieu of suspension or revocation
        </div>

        <!-- Hairline divider -->
        <div class="w-full h-[1px] bg-[rgba(148,163,184,0.16)] my-1"></div>

        <!-- Answer Section -->
        <div class="pt-6 pb-4 flex flex-col">
          <span class="text-[12px] font-medium text-[#a3b1c6] uppercase tracking-wider mb-2">Statutory limit</span>
          <!-- Large and bold in green "$2,000" -->
          <div class="heading-helvetica text-[#10b981] font-bold text-[48px] leading-tight tabular-nums tracking-[-0.03em]">
            $2,000
          </div>
          <!-- Short muted citation line in indigo -->
          <div class="mt-3 flex items-center gap-1.5">
            <span class="text-[#818cf8] text-[14px] font-medium">
              (RPL §441-c)
            </span>
            <span class="text-[#a3b1c6]/60 text-[13px] font-normal">
              Department of State disciplinary penalty
            </span>
          </div>
        </div>

        <!-- Card footer station metadata: Spaced repetition stop indicator -->
        <div class="mt-4 pt-4 border-t border-[rgba(148,163,184,0.1)] flex items-center justify-between text-[12px] text-[#a3b1c6]">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#f59e0b]"></span>
            <span>Spaced interval: Stop 2</span>
          </div>
          <span class="tabular-nums">Retention: 84%</span>
        </div>

      </article>
    </section>

    <!-- Bottom Thumb Zone: Action buttons & caption (no tab bar on flashcard review) -->
    <footer class="w-full pt-3 pb-2 flex flex-col gap-3">
      <!-- Two large buttons side by side (at least 44pt target, 52px height) -->
      <div class="grid grid-cols-2 gap-3 w-full">
        <!-- Left: Still learning button (tonal dark with red dot) -->
        <button type="button" class="h-[54px] px-4 rounded-[14px] bg-[#182033] hover:bg-[#1f2b45] active:scale-[0.98] transition-all flex items-center justify-center gap-2.5 border border-[rgba(148,163,184,0.16)] text-[#f1f5f9] font-medium text-[16px]">
          <span class="w-2.5 h-2.5 rounded-full bg-[#ef4444] shrink-0 shadow-[0_0_6px_rgba(239,68,68,0.4)]"></span>
          <span>Still learning</span>
        </button>

        <!-- Right: Got it button (green primary #10b981) -->
        <button type="button" class="h-[54px] px-4 rounded-[14px] bg-[#10b981] hover:bg-[#0ea372] active:scale-[0.98] transition-all flex items-center justify-center text-[#090d16] font-bold text-[16px] heading-helvetica shadow-lg shadow-[#10b981]/20">
          <span>Got it</span>
        </button>
      </div>

      <!-- Quiet caption underneath -->
      <p class="text-center text-[12px] leading-relaxed text-[#a3b1c6] px-3 font-normal">
        Got it moves the card to the next stop: 1 day, 3 days, then 7 days
      </p>
    </footer>

  </main>
</body>
</html>
