<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>New York Real Estate Exam App</title>
  <meta name="description" content="Offline-first NYS Real Estate Salesperson exam practice: custom quizzes, timed mock exams, mistake bank, and analytics.">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NY RE Exam">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/build.css">
  <link rel="stylesheet" href="styles/quiz.css">
  <link rel="stylesheet" href="styles/stats.css">
  <link rel="stylesheet" href="styles/bank.css">
</head>
<body>
  <div id="app">
    <header id="top" class="topbar"></header>
    <main id="view" tabindex="-1"></main>
    <footer id="bottom" class="bottombar"></footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This app needs JavaScript.</noscript>
  <!-- Views first: they declare global vX() functions that app.js routes to. -->
  <script src="views/home.js" defer></script>
  <script src="views/build.js" defer></script>
  <script src="views/quiz.js" defer></script>
  <script src="views/results.js" defer></script>
  <script src="views/history.js" defer></script>
  <script src="views/mistakes.js" defer></script>
  <script src="views/more.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
