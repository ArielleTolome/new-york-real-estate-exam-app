# pigeonfi:/data/nyrealestate — static PWA behind Coolify's Traefik (routing in traefik-nyrealestate.yaml).
services:
  nyrealestate:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: nyrealestate
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [coolify]
networks:
  coolify:
    external: true
