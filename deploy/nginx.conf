server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "public, max-age=3600"; }
  # The service worker owns offline caching; the app shell must never be stale at the HTTP/CDN layer.
  location ~ \.(js|css|json|html)$ { add_header Cache-Control "no-cache"; }
  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  # Narration URLs carry ?v=<build stamp>, so a long CDN/browser cache is safe; nginx serves byte ranges for seeking.
  location ~ \.mp3$ { add_header Cache-Control "public, max-age=2592000"; add_header Accept-Ranges bytes; }
}
