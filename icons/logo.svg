<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="New York Real Estate Exam App logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="em" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- skyline -->
  <g fill="#1f293d">
    <rect x="70" y="250" width="44" height="150"/>
    <rect x="120" y="205" width="40" height="195"/>
    <!-- Empire State -->
    <rect x="168" y="170" width="54" height="230"/>
    <rect x="178" y="140" width="34" height="30"/>
    <rect x="187" y="112" width="16" height="28"/>
    <rect x="193" y="72" width="4" height="40"/>
    <rect x="230" y="225" width="36" height="175"/>
    <!-- Chrysler -->
    <rect x="274" y="190" width="44" height="210"/>
    <path d="M274 190 L296 128 L318 190 Z"/>
    <rect x="294" y="98" width="4" height="32"/>
    <rect x="326" y="235" width="38" height="165"/>
    <rect x="372" y="265" width="40" height="135"/>
    <rect x="420" y="290" width="22" height="110"/>
  </g>
  <g fill="#334155" opacity=".9">
    <rect x="180" y="190" width="6" height="8"/><rect x="196" y="190" width="6" height="8"/>
    <rect x="180" y="214" width="6" height="8"/><rect x="196" y="214" width="6" height="8"/>
    <rect x="286" y="210" width="6" height="8"/><rect x="300" y="210" width="6" height="8"/>
    <rect x="286" y="236" width="6" height="8"/><rect x="300" y="236" width="6" height="8"/>
  </g>
  <rect x="64" y="398" width="384" height="6" rx="3" fill="#1f293d"/>
  <!-- golden key -->
  <g transform="rotate(-35 256 330)">
    <circle cx="176" cy="330" r="46" fill="none" stroke="url(#gold)" stroke-width="22"/>
    <rect x="216" y="319" width="190" height="22" rx="8" fill="url(#gold)"/>
    <rect x="352" y="341" width="18" height="34" rx="4" fill="url(#gold)"/>
    <rect x="384" y="341" width="18" height="24" rx="4" fill="url(#gold)"/>
  </g>
  <!-- emerald license badge -->
  <g transform="translate(372 120)">
    <path d="M0 -62 L54 -38 L54 10 C54 44 28 66 0 78 C-28 66 -54 44 -54 10 L-54 -38 Z" fill="url(#em)" stroke="#090d16" stroke-width="8"/>
    <path d="M-24 6 L-6 24 L28 -14" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
